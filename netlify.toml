[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints every file under /assets with a content hash in its
# filename (e.g. index-BBUYYqgf.css) — a changed file always gets a new
# URL, so it's safe for browsers/CDNs to cache these forever instead of
# re-validating on every visit. Netlify doesn't set this by default, so
# without it every repeat visit re-downloaded the full JS/CSS bundle
# graph over the network instead of serving it instantly from the
# browser cache. /brand covers the (also-static, rarely-changing) logo
# assets the same way.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html (and any other unhashed route) must always be revalidated —
# it's what points at the current hashed asset filenames, so caching it
# would pin visitors to a stale deploy after every release.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
